name: checks
on: [push, pull_request]
jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/monitor.sh scripts/run-case.sh scripts/verify-console.sh
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate-evidence.py
